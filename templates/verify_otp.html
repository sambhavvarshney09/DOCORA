{% extends "base.html" %}
{% block title %}Verify Email{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="otp-icon">🔐</div>
    <h1>Verify your email</h1>
    <p>We sent a 6-digit OTP to <strong>{{ email }}</strong>.</p>
    <p class="muted">The OTP is valid for 10 minutes.</p>

    <form method="POST">
        <label>Enter OTP</label>
        <input class="otp-input" type="text" name="otp" inputmode="numeric"
               pattern="[0-9]{6}" maxlength="6" placeholder="123456" required>
        <button class="btn primary full">Verify & Create Account</button>
    </form>

    <p class="muted"><a href="{{ url_for('register') }}">← Start registration again</a></p>
</div>
{% endblock %}
